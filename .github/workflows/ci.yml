name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[pipelines,dev]"
      - name: Kaggle CLI for the push_cover tests (kaggle 2.2.5 needs Python 3.11+)
        if: matrix.python-version != '3.10'
        run: pip install -e ".[publish]"
      - run: ruff check --select F,E9 src tools tests
      - run: pytest -q
      - name: Generated kernel has no undefined names
        run: ruff check --select F821 pipelines
      - name: Linter installs as a command with no dependencies
        run: |
          python -m venv /tmp/bare && /tmp/bare/bin/pip install -q . && /tmp/bare/bin/kaggle-dataset-lint --version

  action:
    # The GitHub Action in action.yml, on the runners' own Python (no setup-python): a clean folder passes,
    # a broken one fails with annotations, and the counts come out as outputs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean dataset passes
        id: good
        uses: ./
        with:
          paths: tests/action/good
      - name: Broken dataset fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          paths: |
            tests/action/bad
            tests/action/good
          ignore: cover-missing
      - name: Strict mode fails on the warning
        id: strict
        continue-on-error: true
        uses: ./
        with:
          paths: tests/action/good
          strict: "true"
      - name: Check outcomes and outputs
        shell: bash
        run: |
          test "${{ steps.good.outputs.errors }}" = 0 && test "${{ steps.good.outputs.warnings }}" = 1
          test "${{ steps.bad.outcome }}" = failure && test "${{ steps.bad.outputs.errors }}" = 3
          test "${{ steps.strict.outcome }}" = failure
